[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-artifacts"
version = "0.1.0"
description = "Interactive HTML artifacts for Hermes: forms and review lists served over a tailnet, with persisted input the agent can read back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.0",
]

# Pip-installed plugins are discovered through this group. The directory-plugin route (plugin/plugin.yaml)
# keeps working; see README "Installing".
[project.entry-points."hermes_agent.plugins"]
live-artifacts = "live_artifacts:register"

[tool.setuptools]
packages = ["live_artifacts"]

[tool.setuptools.package-dir]
live_artifacts = "plugin"

[tool.setuptools.package-data]
live_artifacts = ["server/shim.js", "skills/*/SKILL.md", "plugin.yaml", "dashboard/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -p no:cacheprovider --ignore=tests/dashboard"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["live_artifacts"]
